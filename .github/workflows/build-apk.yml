name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Preparar carpeta web y proyecto Capacitor
        run: |
          mkdir -p dist
          echo "<!DOCTYPE html><html><body>Gruper Remote</body></html>" > dist/index.html
          npx cap add android || true
          npx cap sync android
          # Subir versión mínima requerida por inappbrowser
          sed -i -E 's/(minSdkVersion|minSdk)\s*=\s*[0-9]+/\1 = 26/g' android/variables.gradle || true
          sed -i -E 's/(minSdkVersion|minSdk)\s*=\s*[0-9]+/\1 = 26/g' android/app/build.gradle || true
          # Copiar credenciales de Firebase para que no falle al iniciar
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: Gruper-Remote-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
